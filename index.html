<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehedi Hasan Rony</title>
<meta name="description" content="Portfolio of Mehedi Hasan Rony: law postgraduate, teacher and team captain based in Dhaka.">
<meta name="theme-color" content="#2a3ce0">
<meta property="og:type" content="profile">
<meta property="og:title" content="Mehedi Hasan Rony">
<meta property="og:description" content="Law postgraduate, teacher and team captain based in Dhaka.">
<meta property="og:url" content="https://hasanrony97.github.io/portfolio/">
<meta property="og:image" content="https://hasanrony97.github.io/portfolio/assets/photo.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a3ce0'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Arial,sans-serif' font-weight='900' font-size='40' fill='%23ffc02e'%3ER%3C/text%3E%3C/svg%3E">
<script>
  /* থিম আগে থেকেই ঠিক করে নেওয়া, যাতে পাতা খোলার সময় রং ঝলকে না ওঠে */
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,100..800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #171a3d;
    --paper: #f3f2fb;
    --white: #ffffff;
    --blue: #2a3ce0;
    --blue-deep: #1c2aa8;
    --marigold: #ffc02e;
    --muted: #5a5e85;
    --rule: #d6d5ea;

    /* কাজ অনুযায়ী রং: থিম বদলালে শুধু এগুলো বদলায় */
    --bg: var(--paper);
    --surface: var(--white);
    --text: var(--ink);
    --accent: var(--blue);
    --deep: var(--ink);
    --wrap: 1120px;
    --gutter: clamp(20px, 5vw, 56px);
  }

  :root[data-theme="dark"] {
    --bg: #0d0f26;
    --surface: #161a40;
    --text: #ecebfb;
    --accent: #95a2ff;
    --muted: #a4a7cf;
    --rule: #2d3162;
    --deep: #07081a;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    transition: background-color .25s ease, color .25s ease;
    font-family: "Anek Bangla", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="bn"] body { line-height: 1.75; }

  a { color: inherit; }
  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--marigold);
    outline-offset: 3px;
    border-radius: 6px;
  }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: var(--gutter); }

  h1, h2, h3, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }

  h2 {
    font-stretch: 112%;
    font-weight: 750;
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    max-width: 18ch;
  }
  html[lang="bn"] h2 { line-height: 1.3; letter-spacing: 0; }

  /* ---------- top bar ---------- */
  .top {
    position: fixed; inset: 0 0 auto 0; z-index: 5;
    color: var(--white);
    transition: background-color .25s ease, box-shadow .25s ease;
  }
  .top.scrolled { background: var(--ink); box-shadow: 0 2px 18px rgba(23,26,61,.25); }
  .top.scrolled .wrap { padding-block: 12px; }
  .top nav a[aria-current="true"] { border-color: var(--marigold); }
  .top .wrap {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding-block: 20px; transition: padding .25s ease;
  }
  .top nav { display: flex; gap: clamp(14px, 3vw, 32px); }
  .top nav a {
    text-decoration: none; font-weight: 500; font-size: 1rem;
    border-bottom: 2px solid transparent; padding-bottom: 2px;
  }
  .top nav a:hover { border-color: var(--marigold); }

  .tools { display: flex; align-items: center; gap: 10px; }
  .theme {
    width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center;
    background: rgba(255,255,255,.14); color: var(--white);
    transition: transform .2s ease;
  }
  .theme:hover { transform: rotate(20deg); }
  .theme svg { width: 20px; height: 20px; }
  .theme .sun { display: none; }
  :root[data-theme="dark"] .theme .sun { display: block; }
  :root[data-theme="dark"] .theme .moon { display: none; }
  .lang {
    display: inline-flex; background: rgba(255,255,255,.14);
    border-radius: 999px; padding: 4px;
  }
  .lang button {
    font: inherit; font-size: .95rem; font-weight: 600;
    color: var(--white); background: none; border: 0; cursor: pointer;
    padding: 4px 14px; border-radius: 999px;
  }
  .lang button[aria-pressed="true"] { background: var(--marigold); color: var(--ink); }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    background: var(--blue); color: var(--white);
    padding-block: clamp(110px, 16vw, 170px) clamp(56px, 8vw, 96px);
  }
  .hero .wrap {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: clamp(28px, 5vw, 64px); align-items: end;
  }
  .name {
    font-weight: 800;
    font-stretch: 125%;
    font-size: clamp(3.3rem, 11vw, 8.6rem);
    line-height: .88;
    letter-spacing: -0.02em;
  }
  .name span { display: block; }
  .name span:last-child { color: var(--marigold); }
  html[lang="bn"] .name { line-height: 1.12; letter-spacing: 0; font-size: clamp(3rem, 10vw, 7.6rem); }

  @media (prefers-reduced-motion: no-preference) {
    .name span { animation: stretch 900ms cubic-bezier(.2,.8,.2,1) both; }
    .name span:nth-child(2) { animation-delay: 90ms; }
    .name span:nth-child(3) { animation-delay: 180ms; }
    @keyframes stretch {
      from { font-stretch: 75%; opacity: 0; }
      to   { font-stretch: 125%; opacity: 1; }
    }
  }

  .hero-line {
    margin-top: clamp(20px, 3vw, 32px);
    font-size: clamp(1.15rem, 2vw, 1.45rem);
    line-height: 1.45; max-width: 34ch;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .btn {
    display: inline-block; text-decoration: none;
    font-weight: 650; font-size: 1.05rem;
    padding: 12px 24px; border-radius: 999px;
    border: 2px solid var(--marigold);
    transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-solid { background: var(--marigold); color: var(--ink); }
  .btn-line { color: var(--white); border-color: rgba(255,255,255,.6); }

  .portrait { position: relative; justify-self: end; width: min(100%, 300px); }
  /* হলুদ খিলান পেছনে, কাটা ছবি সামনে; মাথা খিলানের উপর দিয়ে বেরিয়ে থাকে */
  .portrait::before {
    content: ""; position: absolute; inset: 14% 0 0 0;
    background: var(--marigold); border-radius: 160px 160px 20px 20px;
  }
  .portrait img {
    position: relative; display: block; width: 100%; height: auto;
    aspect-ratio: 316 / 374; object-fit: cover;
    border-radius: 0 0 20px 20px;
  }

  /* ---------- sections ---------- */
  section { padding-block: clamp(64px, 9vw, 120px); scroll-margin-top: 56px; }

  /* ---------- choice buttons (filters, sports) ---------- */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .pills button, .chips button, .copy {
    font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer;
    padding: 6px 18px; border-radius: 999px;
    border: 1.5px solid var(--text); background: transparent; color: var(--text);
    transition: background-color .15s ease, color .15s ease, transform .15s ease;
  }
  .pills button:hover, .chips button:hover { transform: translateY(-2px); }
  .pills button[aria-pressed="true"], .chips button[aria-pressed="true"] {
    background: var(--text); color: var(--bg);
  }

  .about-top {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    gap: clamp(24px, 5vw, 72px); align-items: start;
  }
  .about p { max-width: 58ch; }
  .about p + p { margin-top: 1em; }

  .strands {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    margin-top: clamp(40px, 6vw, 72px);
    border-top: 2px solid var(--text);
  }
  .strands li { padding: 24px 28px 0 0; }
  .strands li + li { padding-left: 28px; border-left: 1px solid var(--rule); }
  .strands h3 {
    font-stretch: 112%; font-weight: 750; font-size: 1.5rem; color: var(--accent);
    margin-bottom: 8px;
  }
  .strands p { font-size: 1.05rem; color: var(--muted); }

  /* ---------- journey ---------- */
  .journey { background: var(--surface); }
  .timeline {
    margin-top: clamp(36px, 5vw, 60px);
    position: relative; padding-left: 34px;
  }
  /* রেখা: ধূসর পথ (::before) আর তার উপর স্ক্রলের সঙ্গে বাড়তে থাকা হলুদ অংশ (::after) */
  .timeline::before, .timeline::after {
    content: ""; position: absolute; left: 5px; top: 0; width: 3px; border-radius: 3px;
  }
  .timeline::before { bottom: 0; background: var(--rule); }
  .timeline::after { height: calc(var(--progress, 0) * 100%); background: var(--marigold); }
  .timeline > li { position: relative; }
  .timeline > li::before {
    content: ""; position: absolute; left: -36px; top: 36px; z-index: 1;
    width: 17px; height: 17px; border-radius: 50%;
    background: var(--surface); border: 3px solid var(--rule);
    transition: border-color .2s ease, background-color .2s ease;
  }
  .timeline > li.reached::before { border-color: var(--marigold); background: var(--marigold); }
  .timeline li {
    display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr);
    gap: clamp(16px, 4vw, 48px);
    padding-block: 28px; border-top: 1px solid var(--rule);
  }
  .timeline li:last-child { border-bottom: 1px solid var(--rule); }
  .timeline li[hidden] { display: none; }
  .when {
    font-stretch: 80%; font-weight: 800; color: var(--accent);
    font-size: clamp(1.9rem, 4.4vw, 3.2rem); line-height: 1;
  }
  .when small {
    display: block; margin-top: 8px;
    font-stretch: 100%; font-weight: 500; font-size: 1rem; color: var(--muted);
  }
  .timeline h3 { font-weight: 700; font-size: 1.45rem; line-height: 1.25; }
  .place { color: var(--muted); margin-top: 2px; }
  .points { margin-top: 12px; max-width: 62ch; }
  .points li {
    display: block; border: 0; padding: 0 0 0 20px; position: relative;
  }
  .points li:last-child { border: 0; }
  .points li + li { margin-top: 6px; }
  .points li::before {
    content: ""; position: absolute; left: 0; top: .65em;
    width: 8px; height: 8px; border-radius: 50%; background: var(--marigold);
  }
  .now {
    display: inline-block; vertical-align: middle; margin-left: 8px;
    background: var(--marigold); color: var(--ink);
    font-size: .85rem; font-weight: 700; padding: 1px 10px; border-radius: 999px;
  }

  /* ---------- skills ---------- */
  .skills .wrap {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    gap: clamp(24px, 5vw, 72px); align-items: start;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips button { background: var(--surface); }
  .chips button[aria-pressed="true"] { background: var(--text); }
  .proof {
    margin-top: 24px; padding: 18px 22px; max-width: 52ch;
    background: var(--surface); border-left: 5px solid var(--marigold);
    border-radius: 0 12px 12px 0; min-height: 7.5em;
  }
  .proof b { display: block; color: var(--accent); font-weight: 700; }
  .langs { margin-top: 28px; color: var(--muted); }
  .langs b { color: var(--text); font-weight: 700; }

  /* ---------- field ---------- */
  .field {
    position: relative; overflow: hidden;
    background: var(--marigold); color: var(--ink);
    /* হলুদ অংশে লেখা সবসময় গাঢ় থাকবে, থিম যা-ই হোক */
    --text: var(--ink); --bg: var(--white);
  }
  .field svg {
    position: absolute; right: -6%; top: 50%; transform: translateY(-50%);
    height: 150%; width: auto; opacity: .55; pointer-events: none;
  }
  .field .wrap { position: relative; }
  .field ul { margin-top: clamp(28px, 4vw, 44px); max-width: 44ch; }
  .field li {
    font-size: clamp(1.2rem, 2.2vw, 1.5rem); line-height: 1.35; font-weight: 600;
    padding-block: 18px; border-top: 2px solid var(--ink);
  }
  .field li span { display: block; font-size: 1.05rem; font-weight: 450; }
  .field li { transition: opacity .2s ease; }
  .field li.off { opacity: .32; }

  /* ---------- more: research, voices, gallery ---------- */
  .more-top {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(28px, 5vw, 72px); align-items: start;
  }
  .more h3 {
    font-stretch: 112%; font-weight: 750; font-size: 1.5rem; color: var(--accent);
    margin-bottom: 12px;
  }
  .more .big { font-size: clamp(1.3rem, 2.4vw, 1.7rem); font-weight: 650; line-height: 1.3; }
  .more .big + p { margin-top: 10px; color: var(--muted); max-width: 52ch; }
  .more blockquote {
    margin: 0; padding-left: 22px; border-left: 5px solid var(--marigold);
    font-size: clamp(1.3rem, 2.4vw, 1.7rem); font-weight: 500; line-height: 1.35;
  }
  .more blockquote + p { margin-top: 12px; padding-left: 27px; color: var(--muted); }
  .gallery {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;
    margin-top: 16px;
  }
  .gallery figure { margin: 0; }
  .gallery img, .gallery .art {
    display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px;
  }
  .gallery .art { display: grid; place-items: center; transition: transform .2s ease; }
  .gallery .art svg { width: 46%; height: auto; }
  .gallery figure:hover .art { transform: translateY(-4px); }
  .art-law   { background: var(--blue); color: var(--white); }
  .art-class { background: var(--ink); color: var(--marigold); }
  .art-field { background: var(--marigold); color: var(--ink); }
  :root[data-theme="dark"] .art-class { background: var(--surface); }
  .gallery figcaption { margin-top: 10px; font-size: 1.05rem; color: var(--text); max-width: 30ch; }
  .more-gallery { margin-top: clamp(40px, 6vw, 72px); }
  .sample {
    display: inline-block; margin-bottom: 28px;
    background: var(--marigold); color: var(--ink);
    font-size: .95rem; font-weight: 700; padding: 4px 14px; border-radius: 999px;
  }
  .sample[hidden] { display: none; }

  /* ---------- contact ---------- */
  .contact { background: var(--deep); color: var(--white); }
  .contact h2 { max-width: 16ch; }
  .mail {
    display: inline-block; margin-top: clamp(24px, 4vw, 40px);
    font-stretch: 90%; font-weight: 700; color: var(--marigold);
    font-size: clamp(1.5rem, 5.4vw, 3.4rem); line-height: 1.15;
    text-decoration-thickness: 3px; text-underline-offset: 8px;
    overflow-wrap: anywhere;
  }
  .copy {
    margin-left: 14px; vertical-align: middle;
    border-color: rgba(255,255,255,.6); color: var(--white);
  }
  .copy.done { background: var(--marigold); border-color: var(--marigold); color: var(--ink); }
  .ways {
    display: flex; flex-wrap: wrap; gap: 14px 40px;
    margin-top: 32px; font-size: 1.15rem;
  }
  .ways a { text-underline-offset: 5px; }
  .ways [hidden] { display: none; }
  .contact .actions { margin-top: 36px; }
  footer {
    margin-top: clamp(48px, 7vw, 88px); padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.2);
    color: rgba(255,255,255,.65); font-size: .95rem;
  }

  /* ---------- pointer animation ---------- */
  /* মাউসের পেছনে চলা বৃত্ত; difference মোডে যেকোনো রঙের উপর দেখা যায় */
  .cursor {
    position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border: 2px solid #fff; border-radius: 50%;
    mix-blend-mode: difference; opacity: 0;
    transition: width .2s ease, height .2s ease, margin .2s ease,
                opacity .2s ease, background-color .2s ease;
  }
  .cursor.on { opacity: var(--o, 1); }
  .cursor.echo { border-width: 1.5px; }
  .cursor.big {
    width: 64px; height: 64px; margin: -32px 0 0 -32px;
    background: rgba(255,255,255,.18);
  }
  /* হিরো অংশে মাউসের নিচে নরম আলো */
  .hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(460px circle at var(--mx, 50%) var(--my, 50%),
                rgba(255,255,255,.2), transparent 70%);
    opacity: 0; transition: opacity .35s ease;
  }
  .hero.lit::after { opacity: 1; }
  .portrait img { transition: transform .25s ease-out; }

  /* ---------- small screens ---------- */
  @media (max-width: 780px) {
    .top nav { display: none; }
    .hero .wrap, .about-top, .skills .wrap, .more-top { grid-template-columns: minmax(0, 1fr); }
    .gallery { grid-template-columns: minmax(0, 1fr); }
    .portrait { justify-self: start; width: min(70%, 240px); margin-top: 12px; }
    .strands { grid-template-columns: minmax(0, 1fr); border-top: 0; }
    .strands li, .strands li + li {
      padding: 20px 0; border-left: 0; border-top: 2px solid var(--text);
    }
    .timeline li { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .field svg { opacity: .3; }
  }

  @media print {
    .top, .actions, .field svg { display: none; }
    .hero, .contact { background: none; color: var(--ink); padding-block: 24px; }
    section { padding-block: 24px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <nav aria-label="Sections">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#journey" data-i18n="nav.journey"></a>
      <a href="#skills" data-i18n="nav.skills"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="tools">
      <button type="button" class="theme" id="theme" data-i18n-label="theme.label">
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="bn" aria-pressed="false">বাংলা</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <div class="wrap">
      <div>
        <h1 class="name" id="name"></h1>
        <p class="hero-line" data-i18n="hero.line"></p>
        <div class="actions">
          <a class="btn btn-solid" href="assets/Mehedi_Hasan_Rony_CV.pdf" download data-i18n="cta.cv"></a>
          <a class="btn btn-line" href="#contact" data-i18n="cta.contact"></a>
        </div>
      </div>
      <div class="portrait">
        <img src="assets/photo-cutout.png" width="632" height="748" alt="" data-i18n-alt="hero.alt">
      </div>
    </div>
  </div>

  <section class="about" id="about">
    <div class="wrap about-top">
      <h2 data-i18n="about.title"></h2>
      <div>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </div>
    </div>
    <div class="wrap">
      <ul class="strands">
        <li><h3 data-i18n="s1.t"></h3><p data-i18n="s1.d"></p></li>
        <li><h3 data-i18n="s2.t"></h3><p data-i18n="s2.d"></p></li>
        <li><h3 data-i18n="s3.t"></h3><p data-i18n="s3.d"></p></li>

/* পথচলার রেখা: পর্দার ৬০% উচ্চতা পর্যন্ত যতটুকু টাইমলাইন পেরিয়েছে, ততটুকু হলুদ */
function drawJourneyLine() {
  const timeline = document.querySelector(".timeline");
  const box = timeline.getBoundingClientRect();
  const mark = window.innerHeight * 0.6;
  const progress = Math.min(1, Math.max(0, (mark - box.top) / box.height));
  timeline.style.setProperty("--progress", progress);
  timeline.querySelectorAll(":scope > li").forEach(li => {
    li.classList.toggle("reached", li.getBoundingClientRect().top + 44 < mark);
  });
}

function filterJourney(kind) {
  document.querySelectorAll("#filter button").forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.kind === kind));
  });
  document.querySelectorAll(".timeline > li").forEach(li => {
    li.hidden = kind !== "all" && li.dataset.kind !== kind;
  });
  drawJourneyLine();
}

  document.documentElement.lang = lang;
  document.title = TEXT.name[lang].join(" ");

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = TEXT[el.dataset.i18n][lang];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = TEXT[el.dataset.i18nHtml][lang];
  });
  document.querySelectorAll("[data-i18n-alt]").forEach(el => {
    el.alt = TEXT[el.dataset.i18nAlt][lang];
  });

  document.getElementById("name").innerHTML =
    TEXT.name[lang].map(part => `<span>${part}</span>`).join("");
  document.querySelectorAll("[data-i18n-label]").forEach(el => {
    el.setAttribute("aria-label", TEXT[el.dataset.i18nLabel][lang]);
  });
  renderSkills();
  renderGallery();
  document.getElementById("phone").textContent = TEXT["contact.phone"][lang];

  document.querySelectorAll(".lang button").forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
  });
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

/* মাউস পয়েন্টারের অ্যানিমেশন: শুধু মাউস আছে এমন ডিভাইসে, আর "কম নড়াচড়া" চাইলে বন্ধ */
const hasMouse = matchMedia("(hover: hover) and (pointer: fine)").matches;
const wantsMotion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
if (hasMouse && wantsMotion) {
  /* প্রথমটি মূল বৃত্ত, বাকি তিনটি তার "প্রতিধ্বনি": প্রতিটি আগেরটির চেয়ে ঝাপসা।
     সংখ্যাগুলো হলো প্রতিটি বৃত্তের স্বচ্ছতা; তালিকায় সংখ্যা বাড়ালে প্রতিধ্বনি বাড়বে */
  const rings = [1, 0.5, 0.28, 0.12].map((opacity, i) => {
    const el = document.createElement("div");
    el.className = i === 0 ? "cursor" : "cursor echo";
    el.style.setProperty("--o", opacity);
    el.setAttribute("aria-hidden", "true");
    document.body.appendChild(el);
    /* প্রতিটি প্রতিধ্বনি আগেরটির চেয়ে ২০% ছোট: ১, ০.৮, ০.৬, ০.৪ */
    return { el, x: 0, y: 0, scale: 1 - i * 0.2 };
  });
  const ring = rings[0].el;

  let targetX = 0, targetY = 0, running = false;

  /* মূল বৃত্ত মাউসকে অনুসরণ করে, আর প্রতিটি প্রতিধ্বনি তার আগের বৃত্তকে।
     প্রতি ফ্রেমে বাকি দূরত্বের একটি অংশ এগোয় বলে সবগুলো শিকলের মতো পিছু নেয় */
  const follow = () => {
    let leadX = targetX, leadY = targetY;
    rings.forEach((r, i) => {
      const ease = i === 0 ? 0.2 : 0.3;
      r.x += (leadX - r.x) * ease;
      r.y += (leadY - r.y) * ease;
      r.el.style.transform = `translate3d(${r.x}px, ${r.y}px, 0) scale(${r.scale})`;
      leadX = r.x; leadY = r.y;
    });
    const last = rings[rings.length - 1];
    if (Math.abs(targetX - last.x) + Math.abs(targetY - last.y) > 0.3) requestAnimationFrame(follow);
    else running = false;
  };

  window.addEventListener("pointermove", event => {
    if (event.pointerType === "touch") return;
    targetX = event.clientX;
    targetY = event.clientY;
    if (!ring.classList.contains("on")) {
      rings.forEach(r => { r.x = targetX; r.y = targetY; r.el.classList.add("on"); });
    }
    ring.classList.toggle("big", Boolean(event.target.closest("a, button")));
    if (!running) { running = true; requestAnimationFrame(follow); }
  }, { passive: true });
  document.documentElement.addEventListener("pointerleave", () => {
    rings.forEach(r => r.el.classList.remove("on"));
  });

  /* হিরো: মাউসের নিচে আলো, আর ছবি মাউসের দিকে সামান্য সরে */
  const hero = document.querySelector(".hero");
  const portrait = document.querySelector(".portrait img");
  hero.addEventListener("pointermove", event => {
    const box = hero.getBoundingClientRect();
    hero.style.setProperty("--mx", (event.clientX - box.left) + "px");
    hero.style.setProperty("--my", (event.clientY - box.top) + "px");
    hero.classList.add("lit");
    const dx = (event.clientX - box.left) / box.width - 0.5;
    const dy = (event.clientY - box.top) / box.height - 0.5;
    portrait.style.transform = `translate(${dx * 14}px, ${dy * 10}px)`;
  }, { passive: true });
  hero.addEventListener("pointerleave", () => {
    hero.classList.remove("lit");
    portrait.style.transform = "";
  });
}
